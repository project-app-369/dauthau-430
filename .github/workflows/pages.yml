name: Deploy dauthau-430 to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build portable static PWA
        env:
          PUBLIC_SITE_URL: https://project-app-369.github.io/dauthau-430/
        run: python3 build-site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Wait for Pages artifact visibility
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          for attempt in $(seq 1 24); do
            count=$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length')
            if [ "$count" -gt 0 ]; then exit 0; fi
            sleep 5
          done
          echo "Uploaded Pages artifact did not become visible" >&2
          exit 1
      - name: Deploy
        id: deployment
        uses: actions/github-script@v8
        with:
          script: |
            // Use the visible REST artifact ID directly; the results-service
            // discovery endpoint can lag behind an already successful upload.
            const {owner, repo} = context.repo;
            let artifact;
            for (let attempt = 0; attempt < 24; attempt++) {
              const response = await github.rest.actions.listWorkflowRunArtifacts({
                owner, repo, run_id: context.runId, per_page: 100,
                headers: {'Cache-Control': 'no-cache'}
              });
              artifact = response.data.artifacts.find(a => a.name === 'github-pages' && !a.expired);
              if (artifact) break;
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            if (!artifact) throw new Error('Pages artifact is unavailable');
            const oidc = await core.getIDToken();
            core.setSecret(oidc);
            const {data: deployment} = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              owner, repo, artifact_id: artifact.id, pages_build_version: context.sha, oidc_token: oidc
            });
            for (let attempt = 0; attempt < 60; attempt++) {
              const {data: status} = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{deployment_id}', {
                owner, repo, deployment_id: deployment.id
              });
              if (status.status === 'succeed') {
                core.setOutput('page_url', deployment.page_url || 'https://project-app-369.github.io/dauthau-430/');
                return;
              }
              if (['errored','failed','canceled'].includes(status.status)) throw new Error('Pages deployment: ' + status.status);
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            throw new Error('Pages deployment did not finish within 5 minutes');
